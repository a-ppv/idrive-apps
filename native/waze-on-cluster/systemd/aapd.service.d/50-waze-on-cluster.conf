# waze-on-cluster: the Android Auto patch in memory (PATCH.md "In memory").
# Boot recovery writes this file in /run only for a start it arms, with
# LD_PRELOAD (the unit's own libschedconfig, then libwocpatch.so) and the
# plan's paths. Without it ("-"), aapd starts as it ships.
[Service]
EnvironmentFile=-/run/woc-preload/aapd.env
